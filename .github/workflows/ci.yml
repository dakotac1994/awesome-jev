name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check examples
        run: python -m compileall -q examples
      - name: Run examples in offline demo mode
        run: |
          python examples/quickstart.py --demo
          python examples/confidence_gate.py --demo
          python examples/ticket_triage.py --demo
      - name: Shell-check curl example
        run: sh -n examples/curl.sh
