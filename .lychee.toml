# lychee link-check config
# See https://github.com/lycheeverse/lychee

exclude = [
  # login-walled / bot-hostile
  "https://www.linkedin.com.*",
  "https://x.com.*",
  # POST-only API endpoint: GET/HEAD returns 405 by design
  "https://api.typesafe.ai/v1/systemone",
  # real article, but the site 403s automated checks
  "https://www.marktechpost.com/2026/09/23/a-coding-guide-to-typesafe-ai-jev/",
  # registry homepage 403s some bot traffic
  "https://www.npmjs.com",
  # real page, but Product Hunt 403s automated checks
  "https://www.producthunt.com/products/made-with-jev",
]

max_retries = 3
timeout = 20
